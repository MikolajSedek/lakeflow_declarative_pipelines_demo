name: Deploy to Databricks

# Triggered on push to main (production) or test (staging) branches.
# Assumes lint + unit-test jobs in ci.yml passed via a branch-protection rule
# that gates merges on the CI workflow.
on:
  push:
    branches:
      - main
      - test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Databricks Asset Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Install the Databricks CLI (latest release)
      # https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/install
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
            | sudo sh

      # Validate the bundle before deploying
      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle validate

      # Deploy to the 'prod' target when merging to main,
      # or to the 'dev' target when merging to test.
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi
          databricks bundle deploy --target "$TARGET" --auto-approve
