repos:
  # ── general file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-ast
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch=main, --branch=master]
      - id: check-docstring-first
      - id: check-case-conflict
      - id: name-tests-test
        args: [--pytest-test-first]
        files: ^tests/

  # ── pyupgrade: auto-upgrade Python syntax to 3.10+ ───────────────────────
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # ── black: the uncompromising Python code formatter ─────────────────────
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  # ── ruff: fast linting + formatting + import sorting ──────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ── mypy: static type checking (only on testable modules, not notebooks) ─
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]
        args: [--ignore-missing-imports]
        files: ^(transformations|data_generation)\.py$

  # ── bandit: security linting ──────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        # Skip notebooks (reference Databricks globals) and tests (assert is fine)
        exclude: ^(01|02|03)\.|tests/

  # ── pydocstyle: docstring convention enforcement (Google style) ───────────
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: [tomli]
        args: [--config=pyproject.toml]
        files: ^(transformations|data_generation)\.py$

  # ── interrogate: docstring coverage ───────────────────────────────────────
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [-c, pyproject.toml]

  # ── codespell: catch common typos ─────────────────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--skip=*.csv,--skip=*.json]
