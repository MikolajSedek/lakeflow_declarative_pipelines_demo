[project]
name = "lakeflow-declarative-pipelines-demo"
version = "0.1.0"
description = "Demo code for running Lakeflow Declarative Pipelines in Databricks Free Edition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "logzero>=1.7.0",
    "mimesis>=19.1.0",
    "pendulum>=3.2.0",
    "pydantic>=2.12.5",
    "pyspark>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
